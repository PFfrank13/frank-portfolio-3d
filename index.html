  <body>
    <div id="root"></div>
    <noscript>Este portafolio necesita JavaScript activado.</noscript>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Aviso si se abre este archivo FUENTE con doble clic: no puede funcionar sin compilar. -->
    <script>
      setTimeout(function () {
        if (window.__APP_MOUNTED__) return;
        var root = document.getElementById('root');
        if (root && root.childNodes.length) return;
        document.body.style.cssText = 'margin:0;background:#0c0d0e;color:#ebe7df;font-family:system-ui,sans-serif';
        document.body.insertAdjacentHTML(
          'beforeend',
          '<div style="max-width:620px;margin:12vh auto;padding:24px;line-height:1.7">' +
            '<h2 style="margin:0 0 12px">Este es el archivo fuente</h2>' +
            '<p>No se puede abrir con doble clic. Elige una opción:</p>' +
            '<p><b>1.</b> En la carpeta del proyecto: <code>npm install</code> y luego <code>npm run dev</code></p>' +
            '<p><b>2.</b> <code>npm run build:single</code> y abre <code>dist-single/index.html</code> (ese sí funciona con doble clic)</p>' +
            '</div>'
        );
      }, 1500);
    </script>
